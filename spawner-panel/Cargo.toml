[package]
name = "m182_spawner_panel"
version = "0.1.0"
edition = "2021"

[lib]
name = "m182_spawner_panel"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "M182_AdminPannel"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
serde_json = "1"
miniz_oxide = "0.8"
winit = { version = "0.30", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = true

[features]
linux-preview = ["eframe/x11"]
