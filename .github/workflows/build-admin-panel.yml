name: Build M182 Admin Pannel

on:
  workflow_dispatch:
  push:
    branches:
      - m182-native-layer
    paths:
      - "spawner-panel/**"
      - ".github/workflows/build-admin-panel.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: spawner-panel

      - name: Build
        working-directory: spawner-panel
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item spawner-panel/target/release/M182_AdminPannel.exe dist/M182_AdminPannel.exe
          Compress-Archive -Path dist/M182_AdminPannel.exe -DestinationPath dist/M182_AdminPannel.zip -Force
          (Get-FileHash dist/M182_AdminPannel.exe -Algorithm SHA256).Hash | Out-File dist/SHA256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: M182_AdminPannel
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "admin-pannel-latest"
          gh release delete $tag --cleanup-tag --yes 2>$null
          gh release create $tag dist/M182_AdminPannel.exe dist/M182_AdminPannel.zip dist/SHA256.txt --target "${{ github.sha }}" --title "M182 Admin Pannel (latest build)" --notes "Windows build of the M182 Admin Pannel (work in progress). Built automatically from this repository by GitHub Actions."
