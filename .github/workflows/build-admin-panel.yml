name: Build M182 release

on:
  workflow_dispatch:
  push:
    branches:
      - m182-native-layer
    paths:
      - "spawner-panel/**"
      - "eml-fork/**"
      - "nexus-package/**"
      - "release-package/**"
      - "spawner-mods/**"
      - ".github/workflows/build-admin-panel.yml"

permissions:
  contents: write

jobs:
  panel:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spawner-panel
      - name: Build
        working-directory: spawner-panel
        run: cargo build --release --locked --lib
      - uses: actions/upload-artifact@v4
        with:
          name: panel
          path: spawner-panel/target/release/m182_spawner_panel.dll
          if-no-files-found: error

  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: eml-fork
      - name: Build
        working-directory: eml-fork
        run: cargo build --release --locked -p dbghelp-proxy
      - uses: actions/upload-artifact@v4
        with:
          name: native
          path: eml-fork/target/release/dbghelp.dll
          if-no-files-found: error

  publish:
    needs: [panel, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package
        run: |
          mkdir -p dist
          for side in Cliente Servidor; do
            out=dist/M182_$side
            mkdir -p $out/mods/m182_spawn_variants/src
            cp release-package/$side/* $out/
            cp artifacts/native/dbghelp.dll $out/
            cp spawner-mods/m182_spawn_variants/mod.json $out/mods/m182_spawn_variants/
            cp spawner-mods/m182_spawn_variants/src/mod.lua $out/mods/m182_spawn_variants/src/
          done
          cp artifacts/panel/m182_spawner_panel.dll dist/M182_Cliente/M182_Panel.dll
          cp eml-fork/LICENSE dist/M182_Cliente/ || true
          mkdir -p dist/M182_PvP/mods/m182_spawn_variants/src
          cp artifacts/native/dbghelp.dll dist/M182_PvP/
          cp nexus-package/m182_native.json nexus-package/eml.json nexus-package/README.txt dist/M182_PvP/
          cp eml-fork/LICENSE dist/M182_PvP/
          cp spawner-mods/m182_spawn_variants/mod.json dist/M182_PvP/mods/m182_spawn_variants/
          cp spawner-mods/m182_spawn_variants/src/mod.lua dist/M182_PvP/mods/m182_spawn_variants/src/
          (cd dist && zip -r M182_PvP_Nexus.zip M182_PvP && zip -r M182_Cliente.zip M182_Cliente && zip -r M182_Servidor.zip M182_Servidor)
          (cd dist && sha256sum M182_Cliente.zip M182_Servidor.zip M182_PvP_Nexus.zip > SHA256.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=admin-pannel-latest
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" dist/M182_Cliente.zip dist/M182_Servidor.zip dist/M182_PvP_Nexus.zip dist/SHA256.txt --target "${{ github.sha }}" --title "M182 latest build" --notes "Automatic build: M182 Cliente and Servidor folders (in-game panel, Insert) and the M182 PvP package for Nexus. Work in progress."
