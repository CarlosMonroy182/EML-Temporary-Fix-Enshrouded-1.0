name: Build M182 release

on:
  workflow_dispatch:
  push:
    branches:
      - m182-native-layer
    paths:
      - "spawner-panel/**"
      - "eml-fork/**"
      - "nexus-package/**"
      - "release-package/**"
      - "spawner-mods/**"
      - ".github/workflows/build-admin-panel.yml"

permissions:
  contents: write

jobs:
  panel:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            spawner-panel
            en-panel
      - name: Build
        working-directory: spawner-panel
        run: cargo build --release --locked --lib
      - name: Build English
        shell: bash
        run: |
          python spawner-panel/tools/localize.py spawner-panel/src en-panel/src
          cp spawner-panel/Cargo.toml spawner-panel/Cargo.lock en-panel/
          cp -r spawner-panel/assets en-panel/assets
          cd en-panel
          cargo build --release --locked --lib
      - uses: actions/upload-artifact@v4
        with:
          name: panel
          path: spawner-panel/target/release/m182_spawner_panel.dll
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: panel-en
          path: en-panel/target/release/m182_spawner_panel.dll
          if-no-files-found: error

  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: eml-fork
      - name: Build
        working-directory: eml-fork
        run: cargo build --release --locked -p dbghelp-proxy
      - name: Guard - dbghelp.dll must keep EML 0.2.0 loader fixes and the M182 VFX
        shell: bash
        run: |
          f=eml-fork/target/release/dbghelp.dll
          for marker in "KFCWriter is no longer available" "Failed to apply resource" "M182 VFX"; do
            grep -qa "$marker" "$f" || { echo "dbghelp.dll is missing marker: $marker"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native
          path: eml-fork/target/release/dbghelp.dll
          if-no-files-found: error
  publish:
    needs: [panel, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package
        run: |
          mkdir -p dist
          pack() {
            side=$1; folder=$2; panel=$3; readme=$4; text=$5
            out=dist/$folder
            mkdir -p $out/mods/m182_spawn_variants/src $out/mods/zz_m182_item_stats/src $out/mods/m182_diag_build/src
            cp release-package/$side/* $out/
            cp release-package/text/$text $out/$readme
            cp artifacts/native/dbghelp.dll $out/
            cp spawner-mods/m182_spawn_variants/mod.json $out/mods/m182_spawn_variants/
            cp spawner-mods/m182_spawn_variants/src/mod.lua $out/mods/m182_spawn_variants/src/
            cp spawner-mods/zz_m182_item_stats/mod.json $out/mods/zz_m182_item_stats/
            cp spawner-mods/zz_m182_item_stats/src/mod.lua $out/mods/zz_m182_item_stats/src/
            cp spawner-mods/m182_diag_build/mod.json $out/mods/m182_diag_build/
            cp spawner-mods/m182_diag_build/src/mod.lua spawner-mods/m182_diag_build/src/m182_diag_build_config.lua $out/mods/m182_diag_build/src/
            mkdir -p $out/mods/m182_divine/src
            cp spawner-mods/m182_divine/mod.json $out/mods/m182_divine/
            cp spawner-mods/m182_divine/src/mod.lua $out/mods/m182_divine/src/
            if [ "$side" = Cliente ]; then
              cp artifacts/$panel/m182_spawner_panel.dll $out/M182_Panel.dll
              cp eml-fork/LICENSE $out/ || true
            fi
          }
          pack Cliente M182_Cliente panel LEEME.txt es/Cliente.txt
          pack Servidor M182_Servidor panel LEEME.txt es/Servidor.txt
          pack Cliente M182_Client panel-en README.txt en/Cliente.txt
          pack Servidor M182_Server panel-en README.txt en/Servidor.txt
          for side in Client Server; do
            rm -rf dist/M182_Nexus_$side
            cp -r dist/M182_$side dist/M182_Nexus_$side
            lower=$(echo $side | tr A-Z a-z)
            cp nexus-package/public/$lower/* dist/M182_Nexus_$side/
            cp nexus-package/public/text/$side.txt dist/M182_Nexus_$side/README.txt
            cp eml-fork/LICENSE dist/M182_Nexus_$side/ || true
          done
          for folder in M182_Cliente M182_Servidor M182_Client M182_Server M182_Nexus_Client M182_Nexus_Server; do
            if find dist/$folder | grep -iE "pillar|inferno|m182_vfx"; then echo "$folder must not ship the pillar, the beam or the VFX mod"; exit 1; fi
            test -f dist/$folder/mods/m182_diag_build/src/mod.lua || { echo "$folder is missing m182_diag_build"; exit 1; }
          done
          for file in dist/*/m182_native.json; do
            if grep -q "client_build_anywhere" $file; then echo "$file must not contain client_build_anywhere"; exit 1; fi
          done
          if grep -rail "build_anywhere\|build anywhere" dist; then echo "a packaged file still mentions build anywhere"; exit 1; fi
          if grep -rIlE '"(chat_key|remote_key)": "[^"]' dist/M182_Nexus_Client dist/M182_Nexus_Server; then echo "the public packages must ship without a key"; exit 1; fi
          client_key=$(grep -o '"remote_key": "[^"]*"' dist/M182_Client/m182_native.json | cut -d'"' -f4)
          for folder in M182_Cliente M182_Client; do
            grep -q "\"remote_key\": \"$client_key\"" dist/$folder/m182_native.json || { echo "$folder: remote_key differs"; exit 1; }
          done
          for folder in M182_Servidor M182_Server; do
            grep -q "\"chat_key\": \"$client_key\"" dist/$folder/m182_native.json || { echo "$folder: chat_key does not match the client remote_key"; exit 1; }
          done
          echo "$client_key" | grep -qE '^m182-[0-9a-f]{8}$' || { echo "packaged key has the wrong format"; exit 1; }
          mkdir -p dist/M182_PvP/mods/m182_spawn_variants/src
          cp artifacts/native/dbghelp.dll dist/M182_PvP/
          cp nexus-package/m182_native.json nexus-package/eml.json nexus-package/README.txt dist/M182_PvP/
          cp eml-fork/LICENSE dist/M182_PvP/
          cp spawner-mods/m182_spawn_variants/mod.json dist/M182_PvP/mods/m182_spawn_variants/
          cp spawner-mods/m182_spawn_variants/src/mod.lua dist/M182_PvP/mods/m182_spawn_variants/src/
          (cd dist && zip -r M182_PvP_Nexus.zip M182_PvP && zip -r M182_Cliente_ES.zip M182_Cliente && zip -r M182_Servidor_ES.zip M182_Servidor && zip -r M182_Client_EN.zip M182_Client && zip -r M182_Server_EN.zip M182_Server && zip -r M182_Nexus_Client.zip M182_Nexus_Client && zip -r M182_Nexus_Server.zip M182_Nexus_Server)
          (cd dist && sha256sum M182_*.zip > SHA256.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=admin-pannel-latest
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" dist/M182_Cliente_ES.zip dist/M182_Servidor_ES.zip dist/M182_Client_EN.zip dist/M182_Server_EN.zip dist/M182_PvP_Nexus.zip dist/M182_Nexus_Client.zip dist/M182_Nexus_Server.zip dist/SHA256.txt --target "${{ github.sha }}" --title "M182 latest build" --notes "Automatic build: M182 Client and Server folders in Spanish and English (in-game panel, Insert) and the M182 PvP package for Nexus."
